server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker's embedded DNS, re-consulted rather than cached.
        #
        # nginx resolves a literal upstream hostname once, at startup, and keeps that
        # address for the life of the process. Recreate the api container — which
        # `docker compose up -d --build` does on any code change — and it comes back on a
        # new address while nginx goes on dialling the old one. Every request through the
        # UI then returns 502 while the page itself still loads, because the HTML is
        # static. A variable upstream forces re-resolution on each request instead.
        #
        # $request_uri rather than a rewritten path: with a variable in proxy_pass nginx
        # stops substituting the location prefix, and the incoming path is already the
        # one the API serves.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host api;
        proxy_pass http://$api_host:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sweep progress streams; do not buffer it into uselessness.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
