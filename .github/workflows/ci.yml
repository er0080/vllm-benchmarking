name: CI

# Two tiers, neither needing a GPU. See CLAUDE.md, "Testing".
#
# There is deliberately no hardware tier and no self-hosted runner: the GPU host is the
# system under test, and anything running there during a sweep corrupts the measurement
# in flight.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  # --- Tier 1 -------------------------------------------------------------------
  # Lint, types, unit tests. No services. Fast enough to gate every push.

  tier1:
    name: Tier 1 — lint, types, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          uv sync --all-packages --frozen
          cd web && npm ci

      - name: Package versions match VERSION
        run: python3 scripts/check_versions.py

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: |
          uv run pyright
          cd web && npx tsc --noEmit

      - name: Unit tests
        run: uv run pytest -m "not integration and not vllm_cpu"

      - name: Web build
        run: cd web && npm run build

  # --- Tier 1b ------------------------------------------------------------------
  # The agent's install is a contract with the GPU host, so it gets verified rather
  # than assumed — the same rule CLAUDE.md applies to anything vLLM produces.
  #
  # This job exists because the documented install was wrong and nothing caught it.
  # `uv pip install ./packages/agent` from inside the workspace resolves
  # vllmbench-protocol through `tool.uv.sources` and installs it *editable*: a .pth
  # pointing back at the checkout. It works perfectly until the checkout moves, and
  # then the agent dies with ModuleNotFoundError on a host with no source tree and no
  # obvious explanation. That is exactly what happened on the first real GPU host.
  #
  # So the test is not "does it import" — it is "does it import once the thing it was
  # installed from no longer exists".

  agent-install:
    name: Tier 1 — agent installs self-contained
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # Install from a throwaway clone, then delete it. Installing from $GITHUB_WORKSPACE
      # would leave the source present and prove nothing.
      - name: Install the agent from git into a clean venv
        run: |
          set -euo pipefail
          git clone --no-hardlinks . /tmp/agent-src
          uv venv --python 3.12 /tmp/agent-venv
          VIRTUAL_ENV=/tmp/agent-venv uv pip install \
            "git+file:///tmp/agent-src@$(git rev-parse HEAD)#subdirectory=packages/agent"
          rm -rf /tmp/agent-src

      - name: No package may reference a source checkout
        run: python3 scripts/check_agent_install.py /tmp/agent-venv

      # Importing proves the packages are present; starting proves the dependency list
      # is complete. A missing runtime dep (psutil, without which the orphan reaper
      # refuses to reap) is invisible to an import check in a venv that has it already.
      - name: The installed agent starts and serves /health
        run: |
          set -euo pipefail
          /tmp/agent-venv/bin/python -c \
            "import vllmbench_agent, vllmbench_protocol; print(vllmbench_protocol.__version__)"
          VLLMBENCH_TOKEN=ci-test-token-0123456789 VLLMBENCH_PORT=9110 \
            /tmp/agent-venv/bin/vllmbench-agent &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9110/health > /tmp/health.json; then
              cat /tmp/health.json; echo
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::agent did not answer /health within 20s"
          exit 1

  # --- Tier 2a ------------------------------------------------------------------
  # Real Postgres. Migrations from empty, then integration tests.

  integration:
    name: Tier 2 — postgres and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vllmbench
          POSTGRES_PASSWORD: vllmbench
          POSTGRES_DB: vllmbench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vllmbench -d vllmbench"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://vllmbench:vllmbench@localhost:5432/vllmbench
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install
        run: uv sync --all-packages --frozen

      - name: Migrate from empty
        working-directory: packages/db
        run: uv run alembic upgrade head

      - name: Migrations are idempotent
        working-directory: packages/db
        run: uv run alembic upgrade head

      - name: No un-migrated model changes
        working-directory: packages/db
        # A model edited without a migration passes every test locally and then fails on
        # a fresh database. Autogenerate must find nothing to do.
        run: |
          uv run alembic check

      - name: Integration tests
        run: uv run pytest -m integration

      # --- Forward-only, against data ------------------------------------------------
      #
      # The step above proves migrations run. This proves they run against *rows*, which
      # is a different claim and the one CLAUDE.md actually makes: "a migration that
      # cannot run against real existing data is a release-blocking bug".
      #
      # An empty database cannot find that class of bug at all. A NOT NULL column with no
      # default, a type change that fails on real values, a constraint no historical row
      # satisfies — every one of those passes against nothing and fails against a month of
      # results.
      #
      # The baseline is `main` rather than a tag: for a pull request, main *is* the
      # schema that is already deployed, and it needs no tags to exist. When milestone
      # tags are cut this step reads the same way against them; only the ref changes.
      - name: Check out the deployed schema
        # actions/checkout fetches only the ref under test, so the base branch is not in
        # this clone at all. Fetched shallowly on purpose: this needs one commit's tree,
        # not the history, and fetch-depth: 0 on the checkout would pay for the whole log
        # on every run of every PR.
        env:
          BASE: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git fetch --depth=1 origin "$BASE"
          git worktree add --detach ../baseline FETCH_HEAD

      - name: Create a database at the deployed schema
        run: |
          psql "postgresql://vllmbench:vllmbench@localhost:5432/postgres" \
            -c "CREATE DATABASE vllmbench_seeded;"

      - name: Migrate it with the deployed code, not this branch's
        working-directory: ../baseline
        env:
          DATABASE_URL: postgresql+psycopg://vllmbench:vllmbench@localhost:5432/vllmbench_seeded
        run: |
          uv sync --all-packages --frozen
          cd packages/db && uv run alembic upgrade head

      - name: Seed it with a run, its result and its telemetry
        # Plain SQL with explicit column lists, run against the *old* schema where this
        # branch's models do not exist. An ORM insert would emit the new columns and fail
        # before testing anything.
        run: |
          psql -v ON_ERROR_STOP=1 \
            "postgresql://vllmbench:vllmbench@localhost:5432/vllmbench_seeded" \
            -f scripts/seed_previous_schema.sql

      - name: Apply this branch's migrations on top
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql+psycopg://vllmbench:vllmbench@localhost:5432/vllmbench_seeded
        run: uv run alembic upgrade head

      - name: Every seeded value survived
        # Values, not row counts. A migration that rewrote a throughput figure or dropped
        # one device's telemetry while keeping its peer would pass a count-based check,
        # and that is exactly the silent corruption this repository exists to prevent.
        run: |
          psql -v ON_ERROR_STOP=1 \
            "postgresql://vllmbench:vllmbench@localhost:5432/vllmbench_seeded" \
            -f scripts/verify_seeded_data.sql

  # --- Tier 2b ------------------------------------------------------------------
  # Real vLLM on the CPU backend. The only automated check against actual vLLM
  # anywhere in this project, so a failure here is blocking, not flaky.

  vllm-contract:
    name: Tier 2 — real vLLM contract
    # arm64, not x86_64. The x86 runners are AMD EPYC Zen 5, where the prebuilt CPU
    # image's worker dies silently during warmup — bf16 fails in oneDNN outright and
    # fp32 crashes with no diagnostic at all. The arm64 image is the one verified to
    # work locally on Apple Silicon, and arm64 runners are free for public repos.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install
        run: uv sync --all-packages --frozen

      - name: Read pinned vLLM version
        id: vllm
        run: |
          VERSION=$(grep -v '^#' VLLM_REFERENCE_VERSION | grep -v '^$' | head -1 | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Pinned to vLLM ${VERSION}"

      - name: Start vLLM CPU backend
        # The published multi-arch image rather than CPU wheels: it sidesteps runner
        # CPU-feature detection entirely and is the same artifact developers run locally
        # on Apple Silicon.
        #
        # --load-format dummy skips weight download; the field names and metric names
        # under test do not depend on the weights being real.
        #
        # --shm-size is required, not tuning. vLLM's engine core communicates over
        # shared memory, and Docker's 64 MB default makes it fail at startup with an
        # opaque "Engine core initialization failed". Colima's default is larger, which
        # is why this passed locally and failed on the first CI run.
        #
        # SYS_NICE is load-bearing, not tuning. vLLM's CPU backend binds NUMA memory
        # during worker init via set_mempolicy and migrate_pages, which Docker's default
        # seccomp profile gates on CAP_SYS_NICE. Denied, they log only as warnings and
        # the worker dies later with no further explanation.
        #
        # --dtype float32 rather than bfloat16, and pinned threads, and --enforce-eager:
        # all three reduce variance rather than latency, and float32 keeps this working
        # if the runner arch ever changes again. opt-125m is small enough that the cost
        # is irrelevant, and nothing under test depends on the dtype.
        #
        # For the record, because two of these comments previously claimed otherwise:
        # the x86 failures were NOT a missing CPU feature. Those runners are AMD EPYC
        # Zen 5 and have both AVX512 and bf16. The prebuilt x86_64 image simply picks
        # oneDNN kernels that die on that CPU — silently under fp32, and with a matmul
        # primitive error under bf16. Forcing ONEDNN_MAX_CPU_ISA did not help either.
        # Switching arch is what fixed it.
        run: |
          docker run -d --name vllm-cpu -p 8100:8000 \
            --cap-add=SYS_NICE \
            --shm-size=4g \
            -e VLLM_CPU_KVCACHE_SPACE=2 \
            -e VLLM_CPU_OMP_THREADS_BIND=0-1 \
            -e OMP_NUM_THREADS=2 \
            vllm/vllm-openai-cpu:v${{ steps.vllm.outputs.version }} \
            facebook/opt-125m --load-format dummy --max-model-len 256 \
            --max-num-seqs 4 --dtype float32 --enforce-eager

      - name: Wait for readiness
        # Poll /health rather than sleeping. Model load time varies with runner load,
        # and a fixed sleep is either flaky or wasteful.
        run: |
          for i in $(seq 1 120); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8100/health)" = "200" ]; then
              echo "ready after ~$((i*5))s"; exit 0
            fi
            if ! docker ps -q --filter name=vllm-cpu --filter status=running | grep -q .; then
              echo "::error::vLLM container exited during startup"
              echo "--- exit status ---"
              # 128+n means killed by signal n. 132 is SIGILL, 139 is SIGSEGV. The
              # worker dies with no Python traceback, so the signal is the only thing
              # that distinguishes an unsupported CPU instruction from a crash.
              docker inspect vllm-cpu --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}'
              echo "--- cpu capabilities ---"
              lscpu | grep -iE "model name|^flags" | cut -c1-400
              echo "--- full container log ---"
              docker logs vllm-cpu 2>&1
              echo "--- host resources ---"
              nproc; free -h; df -h /dev/shm
              exit 1
            fi
            sleep 5
          done
          echo "::error::vLLM did not become ready"
          docker logs vllm-cpu | tail -50
          exit 1

      - name: Produce a real benchmark result
        run: |
          docker exec vllm-cpu vllm bench serve \
            --backend vllm --model facebook/opt-125m \
            --dataset-name random --num-prompts 8 \
            --random-input-len 32 --random-output-len 16 \
            --max-concurrency 2 \
            --save-result --result-filename /tmp/bench.json
          docker cp vllm-cpu:/tmp/bench.json "${RUNNER_TEMP}/bench.json"

      - name: Re-derive the serve-argument catalogue
        # The config validation engine checks candidate YAML against this catalogue, so a
        # stale one is worse than none: it would reject a setting the pinned vLLM accepts,
        # or pass one it has dropped, at the moment somebody is trusting it not to.
        #
        # Re-derived from the running container rather than trusted. If upstream renames,
        # adds or removes an argument, this fails here — which is the whole point of tier
        # 2 (CLAUDE.md: have tier 2 re-derive the contract from a live server).
        run: |
          VERSION=${{ steps.vllm.outputs.version }}
          docker exec -i vllm-cpu python - < scripts/capture_serve_args.py \
            > "${RUNNER_TEMP}/serve-args.json"
          uv run python scripts/check_serve_args_catalogue.py \
            "${RUNNER_TEMP}/serve-args.json" \
            "packages/protocol/src/vllmbench_protocol/data/vllm_serve_args_v${VERSION}.json"

      - name: Contract tests
        env:
          VLLM_CPU_BASE_URL: http://localhost:8100
          VLLM_BENCH_RESULT: ${{ runner.temp }}/bench.json
        run: uv run pytest -m vllm_cpu

      - name: Upload the live payload
        # Kept as an artifact so a contract failure can be diagnosed from the actual
        # bytes rather than by re-running and hoping to reproduce.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-bench-result
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: warn

      - name: vLLM logs on failure
        if: failure()
        run: |
          docker logs vllm-cpu 2>&1 || true
          echo "--- host resources ---"
          nproc; free -h; df -h /dev/shm

  # --- Tier 2c ------------------------------------------------------------------
  # Image builds. The only thing that validates the inter-package dependency graph:
  # `uv sync --all-packages` puts everything in one venv locally, so a package that
  # imports another without declaring it resolves fine until it is built alone.

  images:
    name: Tier 2 — image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [vllmbench-db, vllmbench-api, vllmbench-orchestrator, vllmbench-mockagent]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.package }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/python.Dockerfile
          build-args: PACKAGE=${{ matrix.package }}
          push: false
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}

  web-image:
    name: Tier 2 — web image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  compose-stack:
    name: Tier 2 — the documented install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The README's step 1, run literally. Anything that only works because a developer
      # already had images built, a volume with a schema in it, or a service left running
      # is a step this job does not have.
      - name: Bring the stack up the way the README says to
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: The UI is served, and its API calls reach the API
        run: |
          curl -fsS localhost:8080/ > /dev/null
          curl -fsS localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'

      # The regression this job exists for. nginx resolves a literal upstream hostname
      # once and caches it forever, so recreating the api container used to leave the UI
      # returning 502 from a page that still loaded. `docker compose up -d --build` after
      # a code change does exactly this recreate, so the documented upgrade broke the UI.
      - name: The UI survives the api container moving
        run: |
          net=vllmbench_default
          before=$(docker inspect vllmbench-api-1 \
            --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          docker compose stop api

          # Force api onto a different address by occupying the one it just released.
          # Without this a recreate usually hands the same address straight back and the
          # check passes while proving nothing, which is how the bug survived this long.
          #
          # Docker hands out the lowest free address, so throwaway containers fill from
          # the bottom until one takes the address api had. `--ip` would say it in one
          # line and only works on a network with a user-configured subnet, which the
          # compose default is not.
          squatters=""
          for _ in 1 2 3 4 5 6 7 8; do
            cid=$(docker run -d --network "${net}" alpine sleep 300)
            squatters="${squatters} ${cid}"
            got=$(docker inspect "${cid}" \
              --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
            [ "${got}" = "${before}" ] && break
          done

          docker compose up -d --wait api
          after=$(docker inspect vllmbench-api-1 \
            --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          docker rm -f ${squatters} > /dev/null

          if [ "${before}" = "${after}" ]; then
            echo "api kept ${before}; this check would prove nothing, so failing instead"
            exit 1
          fi
          echo "api moved ${before} -> ${after}"
          curl -fsS localhost:8080/api/health | grep -q '"status":"ok"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 50
