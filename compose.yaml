# Control-plane stack. No GPU dependency anywhere in this file, by design: the GPU host
# runs the agent natively via uv and is reached over HTTP (invariants 1 and 3).
#
# Must work identically on native Linux and macOS with Colima. No absolute host paths, no
# host-gateway aliases, no assumptions about UID/GID mapping.
#
# This file PULLS published images and never builds. That is what the README documents, so
# a new user's first command downloads a known artifact rather than compiling one, and
# `docker compose up` means the same thing on their machine as on ours.
#
# To run your own code instead, add the build override:
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# which is what `make up` does. The split is deliberate rather than tidy: a single file
# carrying both `image:` and `build:` resolves differently depending on what is already in
# the local image cache, so a developer editing the API could get a published image and no
# indication of it.
#
# VLLMBENCH_VERSION names a tag that EXISTS. It is not `VERSION` and must not be wired to
# it: `VERSION` says what is being built next, and between a release bump landing on main
# and its tag being pushed there is nothing published under that name. Advancing this pin
# is a separate change made after a release publishes.

name: vllmbench

# Docker's json-file driver is unbounded by default, and these services run for weeks.
# A control plane that fills the host's disk with its own logs would take the database
# down with it — and the first symptom would be a sweep failing to write results, which
# is the most expensive moment to discover a disk problem.
#
# 10 MB × 3 caps each service at 30 MB. Structured logs are one line per event rather
# than per request body, so that is a long history at this stack's volume.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-env: &db-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vllmbench}:${POSTGRES_PASSWORD:-vllmbench}@postgres:5432/${POSTGRES_DB:-vllmbench}

services:
  postgres:
    logging: *logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vllmbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vllmbench}
      POSTGRES_DB: ${POSTGRES_DB:-vllmbench}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Both user and database named explicitly: bare pg_isready reports ready while the
      # target database is still being created on first boot, and migrate then fails.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vllmbench} -d ${POSTGRES_DB:-vllmbench}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    logging: *logging
    image: ghcr.io/er0080/vllm-benchmarking/db:${VLLMBENCH_VERSION:-1.0.0rc6}
    environment: *db-env
    working_dir: /app/packages/db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    logging: *logging
    image: ghcr.io/er0080/vllm-benchmarking/api:${VLLMBENCH_VERSION:-1.0.0rc6}
    environment:
      <<: *db-env
      VLLMBENCH_TOKEN: ${VLLMBENCH_TOKEN:-}
      VLLMBENCH_MCP_ENABLED: ${VLLMBENCH_MCP_ENABLED:-false}
      VLLMBENCH_MCP_WRITE_ENABLED: ${VLLMBENCH_MCP_WRITE_ENABLED:-true}
      VLLMBENCH_MCP_TOKEN: ${VLLMBENCH_MCP_TOKEN:-}
      VLLMBENCH_MCP_ALLOWED_HOSTS: ${VLLMBENCH_MCP_ALLOWED_HOSTS:-[]}
    command:
      ["uvicorn", "vllmbench_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orchestrator:
    logging: *logging
    image: ghcr.io/er0080/vllm-benchmarking/orchestrator:${VLLMBENCH_VERSION:-1.0.0rc6}
    environment:
      <<: *db-env
      VLLMBENCH_TOKEN: ${VLLMBENCH_TOKEN:-}
    command: ["python", "-m", "vllmbench_orchestrator"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    logging: *logging
    image: ghcr.io/er0080/vllm-benchmarking/web:${VLLMBENCH_VERSION:-1.0.0rc6}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  # --- dev profile: everything below lets the stack run with no GPU host present ---

  mockagent:
    logging: *logging
    profiles: ["dev"]
    image: ghcr.io/er0080/vllm-benchmarking/mockagent:${VLLMBENCH_VERSION:-1.0.0rc6}
    environment:
      VLLMBENCH_TOKEN: ${VLLMBENCH_TOKEN:-dev-token}
      # Failure injection. Set either to a FailureKind value — engine_out_of_memory,
      # engine_config_rejected, engine_not_ready, benchmark_timeout, benchmark_failed —
      # and the mock refuses that way, with the same status code, message and
      # X-Vllmbench-Failure-Kind header the real agent sends.
      #
      # This is how the failure paths are exercised without a GPU. An engine cannot run
      # out of memory on a laptop, and that is the failure a tuning sweep hits most.
      VLLMBENCH_MOCK_START_FAILURE: ${VLLMBENCH_MOCK_START_FAILURE:-}
      VLLMBENCH_MOCK_BENCH_FAILURE: ${VLLMBENCH_MOCK_BENCH_FAILURE:-}
    command:
      ["uvicorn", "vllmbench_mockagent.main:app", "--host", "0.0.0.0", "--port", "9110"]
    ports:
      - "9110:9110"

  web-dev:
    logging: *logging
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
