[project]
name = "vllmbench-mockagent"
version = "1.0.0rc4"
description = "Mock agent implementing the agent contract with synthetic data, for development and tests"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "vllmbench-protocol",
    # Reuses the real agent's auth so the mock cannot drift into accepting
    # credentials the real one would reject.
    "vllmbench-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllmbench_mockagent"]
