[project]
name = "vllmbench-mockagent"
version = "0.1.0"
description = "Mock agent implementing the agent contract with synthetic data, for development and tests"
requires-python = ">=3.11,<3.14"
dependencies = [
    "vllmbench-protocol",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllmbench_mockagent"]
