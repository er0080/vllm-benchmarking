[project]
name = "vllmbench-protocol"
version = "1.0.0rc6"
description = "Wire types and protocol version shared by the control plane and the GPU-host agent"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.9",
    # For AgentClient. This package installs into the user's vLLM environment, so its
    # dependencies land on the system under test — httpx is acceptable because the agent
    # already needs it to scrape vLLM's /metrics. Weigh anything else added here the
    # same way.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllmbench_protocol"]
