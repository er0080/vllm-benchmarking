[project]
name = "vllmbench-protocol"
version = "0.1.0"
description = "Wire types and protocol version shared by the control plane and the GPU-host agent"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllmbench_protocol"]
