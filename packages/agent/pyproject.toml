[project]
name = "vllmbench-agent"
version = "0.1.0"
description = "GPU-host agent: vLLM lifecycle, benchmarking and telemetry"
requires-python = ">=3.11,<3.14"
dependencies = [
    "vllmbench-protocol",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "nvidia-ml-py>=12.560",
]

[project.scripts]
vllmbench-agent = "vllmbench_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllmbench_agent"]
