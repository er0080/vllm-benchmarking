[project]
name = "vllmbench-orchestrator"
version = "1.0.0rc4"
description = "Sweep execution state machine"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "vllmbench-protocol",
    "vllmbench-db",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    # The mock agent is the orchestrator's integration-test fixture, per CLAUDE.md.
    "vllmbench-mockagent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllmbench_orchestrator"]
