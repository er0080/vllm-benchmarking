[project]
name = "vllmbench-orchestrator"
version = "0.1.0"
description = "Sweep execution state machine"
requires-python = ">=3.11,<3.14"
dependencies = [
    "vllmbench-protocol",
    "vllmbench-db",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllmbench_orchestrator"]
