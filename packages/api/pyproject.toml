[project]
name = "vllmbench-api"
version = "0.1.0"
description = "FastAPI control plane"
requires-python = ">=3.11,<3.14"
dependencies = [
    "vllmbench-protocol",
    "vllmbench-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllmbench_api"]
