[project]
name = "vllmbench-api"
version = "1.0.0rc4"
description = "FastAPI control plane"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "vllmbench-protocol",
    "vllmbench-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=2.0",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    # Parsing a candidate config to validate it. Invariant 5 forbids *transforming* a
    # config, not reading one — what is stored stays the exact bytes that reach
    # `vllm serve --config`, and nothing here writes YAML back out.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    # The mock agent is the API's integration-test fixture, per CLAUDE.md.
    "vllmbench-mockagent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllmbench_api"]
